[package]
name = "patrol-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
futures-util = "0.3.34"
gloo-net = { version = "0.6.0", features = ["websocket"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.82"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
web-sys = { version = "0.3.82", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Location",
    "Navigator",
    "Storage",
    "Url",
    "Window",
] }
