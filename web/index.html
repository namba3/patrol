<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patrol status</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 1100px; padding: 1.5rem; }
      header { align-items: center; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; }
      h1 { margin: 0; }
      button { cursor: pointer; font: inherit; padding: .45rem .8rem; }
      .muted { opacity: .72; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
      th, td { border-bottom: 1px solid #8886; padding: .65rem .5rem; text-align: left; vertical-align: top; }
      th { white-space: nowrap; }
      .status { font-weight: 650; }
      .status-ok { color: #218739; }
      .status-failed { color: #d33; }
      .events { list-style: none; padding: 0; }
      .events li { border-bottom: 1px solid #8886; padding: .5rem 0; overflow-wrap: anywhere; }
      dialog { border: 1px solid #8888; border-radius: .6rem; max-height: 80vh; max-width: min(900px, 90vw); width: 100%; }
      dialog::backdrop { background: #0008; }
      .history-entry { border-top: 1px solid #8886; padding: .8rem 0; }
      .history-content { max-height: 16rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
      .history-diff { max-height: 24rem; overflow: auto; white-space: pre; }
      .history-diff-line { display: block; min-height: 1.35em; padding: 0 .35rem; }
      .history-diff-add { background: #21873933; }
      .history-diff-remove { background: #d3333333; }
      code { overflow-wrap: anywhere; }
      @media (max-width: 650px) { body { padding: 1rem; } th, td { padding: .5rem .35rem; } }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Patrol</h1>
        <p id="connection" class="muted">状態を読み込み中…</p>
      </div>
      <button id="refresh" type="button">状態を更新</button>
    </header>

    <main>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">巡回対象</h2>
        <p id="updated" class="muted"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>対象</th><th>状態</th><th>最終試行</th><th>最終成功</th><th>最終変更</th><th>エラー</th><th>履歴</th></tr>
            </thead>
            <tbody id="status-rows"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="events-heading">
        <h2 id="events-heading">最近の通知</h2>
        <p class="muted">このページを開いている間に届いた通知を表示します。</p>
        <div>
          <label for="event-id">対象</label>
          <select id="event-id"><option value="">すべて</option></select>
          <label for="event-type">イベント</label>
          <select id="event-type">
            <option value="">すべて</option>
            <option value="changed">内容変更</option>
            <option value="poll_failed">巡回失敗</option>
            <option value="poll_recovered">巡回復旧</option>
          </select>
          <button id="apply-filter" type="button">通知を絞り込む</button>
        </div>
        <ul id="events" class="events"></ul>
      </section>
    </main>

    <dialog id="history-dialog" aria-labelledby="history-title">
      <h2 id="history-title">変更履歴</h2>
      <p id="history-message" class="muted"></p>
      <div class="filters">
        <button id="history-newer" type="button" disabled>新しい履歴</button>
        <button id="history-older" type="button" disabled>古い履歴</button>
      </div>
      <button id="history-retry" type="button" hidden>再試行</button>
      <div id="history-entries"></div>
      <form method="dialog"><button type="submit">閉じる</button></form>
    </dialog>

    <script>
      const rows = document.querySelector("#status-rows");
      const connection = document.querySelector("#connection");
      const updated = document.querySelector("#updated");
      const events = document.querySelector("#events");
      const idFilter = document.querySelector("#event-id");
      const eventFilter = document.querySelector("#event-type");
      const historyDialog = document.querySelector("#history-dialog");
      const historyEntries = document.querySelector("#history-entries");
      const historyMessage = document.querySelector("#history-message");
      const historyNewer = document.querySelector("#history-newer");
      const historyOlder = document.querySelector("#history-older");
      const historyRetry = document.querySelector("#history-retry");
      const historyPageSize = 50;
      let currentHistoryId;
      let currentHistoryOffset = 0;
      let eventSocket;
      let reconnectTimer;

      function cell(value, className) {
        const element = document.createElement("td");
        element.textContent = value;
        if (className) element.className = className;
        return element;
      }

      function formatTime(unixMillis) {
        return unixMillis == null ? "—" : new Date(unixMillis).toLocaleString();
      }

      function renderDiff(before, after) {
        const beforeLines = before.split("\n");
        const afterLines = after.split("\n");
        const width = afterLines.length + 1;
        if (beforeLines.length * afterLines.length > 65536) return null;

        const lcs = new Uint16Array((beforeLines.length + 1) * width);
        for (let i = beforeLines.length - 1; i >= 0; i--) {
          for (let j = afterLines.length - 1; j >= 0; j--) {
            const index = i * width + j;
            lcs[index] = beforeLines[i] === afterLines[j]
              ? lcs[(i + 1) * width + j + 1] + 1
              : Math.max(lcs[(i + 1) * width + j], lcs[index + 1]);
          }
        }

        const diff = document.createElement("pre");
        diff.className = "history-diff";
        const addLine = (prefix, value, className) => {
          const line = document.createElement("span");
          line.className = `history-diff-line ${className}`;
          line.textContent = `${prefix}${value || " "}`;
          diff.append(line);
        };
        let i = 0;
        let j = 0;
        while (i < beforeLines.length || j < afterLines.length) {
          if (i < beforeLines.length && j < afterLines.length && beforeLines[i] === afterLines[j]) {
            addLine(" ", beforeLines[i], "");
            i++;
            j++;
          } else if (i < beforeLines.length && (j === afterLines.length || lcs[(i + 1) * width + j] >= lcs[i * width + j + 1])) {
            addLine("− ", beforeLines[i], "history-diff-remove");
            i++;
          } else {
            addLine("+ ", afterLines[j], "history-diff-add");
            j++;
          }
        }
        return diff;
      }

      function appendSnapshot(section, label, content) {
        const title = document.createElement("strong");
        title.textContent = label;
        const snapshot = document.createElement("pre");
        snapshot.className = "history-content";
        snapshot.textContent = content;
        section.append(title, snapshot);
      }

      async function showHistory(id, offset = 0) {
        currentHistoryId = id;
        currentHistoryOffset = offset;
        historyEntries.replaceChildren();
        historyMessage.textContent = "履歴を読み込み中…";
        historyNewer.disabled = true;
        historyOlder.disabled = true;
        historyRetry.hidden = true;
        historyDialog.showModal();
        try {
          const query = new URLSearchParams({
            id,
            limit: String(historyPageSize),
            offset: String(offset),
          });
          const response = await fetch(`/api/v1/history?${query}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const page = await response.json();
          historyMessage.textContent = page.total
            ? `${id} の変更履歴（${page.total}件中 ${page.offset + 1}〜${page.offset + page.entries.length}件）`
            : "変更履歴はありません。";
          historyNewer.disabled = !page.has_newer;
          historyOlder.disabled = !page.has_older;
          for (const entry of page.entries) {
            const section = document.createElement("section");
            section.className = "history-entry";
            const heading = document.createElement("h3");
            heading.textContent = formatTime(entry.timestamp_unix_ms);
            section.append(heading);
            if (entry.previous_content !== null) {
              const diffTitle = document.createElement("strong");
              diffTitle.textContent = `差分${entry.previous_truncated || entry.content_truncated ? "（保存された先頭4 KiB同士の比較）" : ""}`;
              section.append(diffTitle);
              const diff = renderDiff(entry.previous_content, entry.content);
              if (diff) {
                section.append(diff);
              } else {
                const notice = document.createElement("p");
                notice.className = "muted";
                notice.textContent = "行数が多いため差分計算を省略しました。保存された本文を表示します。";
                section.append(notice);
                appendSnapshot(section, "変更前", entry.previous_content);
                appendSnapshot(section, "変更後", entry.content);
              }
            } else {
              const first = document.createElement("p");
              first.textContent = "変更前の内容は履歴にありません。";
              section.append(first);
              appendSnapshot(section, "保存された内容", entry.content);
            }
            historyEntries.append(section);
          }
        } catch (error) {
          historyMessage.textContent = `履歴を取得できません: ${error.message}`;
          historyRetry.hidden = false;
        }
      }

      historyRetry.addEventListener("click", () => {
        showHistory(currentHistoryId, currentHistoryOffset);
      });
      historyNewer.addEventListener("click", () => {
        showHistory(currentHistoryId, Math.max(0, currentHistoryOffset - historyPageSize));
      });
      historyOlder.addEventListener("click", () => {
        showHistory(currentHistoryId, currentHistoryOffset + historyPageSize);
      });

      async function refreshStatus() {
        try {
          const response = await fetch("/api/v1/status", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const statusList = await response.json();
          const selectedId = idFilter.value;
          const allOption = document.createElement("option");
          allOption.value = "";
          allOption.textContent = "すべて";
          idFilter.replaceChildren(allOption);
          for (const item of statusList) {
            const option = document.createElement("option");
            option.value = item.id;
            option.textContent = item.id;
            idFilter.append(option);
          }
          const selectedIdExists = statusList.some((item) => item.id === selectedId);
          idFilter.value = selectedIdExists ? selectedId : "";
          if (selectedId && !selectedIdExists) restartEvents();
          rows.replaceChildren();
          for (const item of statusList) {
            const row = document.createElement("tr");
            const name = document.createElement("td");
            name.textContent = item.id;
            const url = document.createElement("div");
            url.className = "muted";
            url.textContent = item.url;
            name.append(url);
            row.append(name);
            const label = item.status === "ok" ? "正常" : item.status === "failed" ? `失敗 (${item.consecutive_failures})` : "未確認";
            row.append(cell(label, `status status-${item.status}`));
            row.append(cell(formatTime(item.last_attempted_unix_ms)));
            row.append(cell(formatTime(item.last_success_unix_ms)));
            row.append(cell(formatTime(item.last_updated_unix_ms)));
            row.append(cell(item.last_error ?? ""));
            const historyCell = document.createElement("td");
            const historyButton = document.createElement("button");
            historyButton.type = "button";
            historyButton.textContent = "表示";
            historyButton.addEventListener("click", () => showHistory(item.id));
            historyCell.append(historyButton);
            row.append(historyCell);
            rows.append(row);
          }
          updated.textContent = `更新: ${new Date().toLocaleTimeString()} ・ ${statusList.length} 件`;
          connection.textContent = "状態APIに接続中";
        } catch (error) {
          connection.textContent = `状態を取得できません: ${error.message}`;
        }
      }

      function connectEvents() {
        const scheme = location.protocol === "https:" ? "wss:" : "ws:";
        const endpoint = new URL("/", location.href);
        endpoint.protocol = scheme;
        if (idFilter.value) endpoint.searchParams.set("id", idFilter.value);
        if (eventFilter.value) endpoint.searchParams.set("event", eventFilter.value);
        const socket = new WebSocket(endpoint.toString());
        eventSocket = socket;
        socket.onopen = () => { connection.textContent = "状態APIとWebSocketに接続中"; };
        socket.onmessage = (message) => {
          let event;
          try { event = JSON.parse(message.data); } catch { return; }
          const item = document.createElement("li");
          item.textContent = `${new Date().toLocaleTimeString()}  ${event.event}  ${event.id}  ${event.error ?? ""}`;
          events.prepend(item);
          while (events.children.length > 20) events.lastElementChild.remove();
          refreshStatus();
        };
        socket.onclose = () => {
          if (eventSocket !== socket) return;
          connection.textContent = "WebSocketを再接続しています…";
          reconnectTimer = setTimeout(connectEvents, 3000);
        };
        socket.onerror = () => socket.close();
      }

      function restartEvents() {
        clearTimeout(reconnectTimer);
        events.replaceChildren();
        if (eventSocket) {
          eventSocket.onclose = null;
          eventSocket.close();
        }
        connectEvents();
      }

      document.querySelector("#refresh").addEventListener("click", refreshStatus);
      document.querySelector("#apply-filter").addEventListener("click", restartEvents);
      refreshStatus();
      setInterval(refreshStatus, 15000);
      connectEvents();
    </script>
  </body>
</html>
