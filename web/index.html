<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patrol status</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 1100px; padding: 1.5rem; }
      header { align-items: center; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; }
      h1 { margin: 0; }
      button { cursor: pointer; font: inherit; padding: .45rem .8rem; white-space: nowrap; }
      .muted { opacity: .72; }
      .table-wrap { overflow-x: auto; }
      .table-wrap:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
      table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
      th, td { border-bottom: 1px solid #8886; padding: .65rem .5rem; text-align: left; vertical-align: top; }
      th { white-space: nowrap; }
      .status { font-weight: 650; }
      .status-ok { color: #218739; }
      .status-failed { color: #d33; }
      .status-filters { align-items: center; display: flex; flex-wrap: wrap; gap: .5rem; }
      .status-filters input { font: inherit; max-width: 24rem; min-width: 12rem; padding: .25rem .4rem; }
      .events { list-style: none; padding: 0; }
      .events li { align-items: flex-start; border-bottom: 1px solid #8886; display: flex; gap: .75rem; padding: .5rem 0; overflow-wrap: anywhere; }
      .event-details { flex: 1; min-width: 0; }
      .events .event-changed { border-inline-start: .25rem solid #4677cc; padding-inline-start: .55rem; }
      .events .event-failed { border-inline-start: .25rem solid #d33; padding-inline-start: .55rem; }
      .events .event-recovered { border-inline-start: .25rem solid #218739; padding-inline-start: .55rem; }
      dialog { border: 1px solid #8888; border-radius: .6rem; max-height: 80vh; max-width: min(900px, 90vw); width: 100%; }
      dialog::backdrop { background: #0008; }
      .history-entry { border-top: 1px solid #8886; padding: .8rem 0; }
      .history-content { max-height: 16rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
      .history-diff { max-height: 24rem; overflow: auto; white-space: pre; }
      .history-diff-line { display: block; min-height: 1.35em; padding: 0 .35rem; }
      .history-diff-add { background: #21873933; }
      .history-diff-remove { background: #d3333333; }
      code { overflow-wrap: anywhere; }
      @media (max-width: 650px) { body { padding: 1rem; } th, td { padding: .5rem .35rem; } }
      @media (prefers-color-scheme: dark) {
        .status-ok { color: #69d982; }
        .status-failed { color: #ff8177; }
        .events .event-changed { border-inline-start-color: #8ab4f8; }
        .events .event-failed { border-inline-start-color: #ff8177; }
        .events .event-recovered { border-inline-start-color: #69d982; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Patrol</h1>
        <p id="connection" class="muted" role="status" aria-live="polite" aria-atomic="true">状態を読み込み中…</p>
      </div>
      <button id="refresh" type="button">状態を更新</button>
    </header>

    <main>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">巡回対象</h2>
        <p id="updated" class="muted"></p>
        <p id="status-summary" class="muted"></p>
        <div class="status-filters">
          <label for="status-search">対象検索</label>
          <input id="status-search" type="search" autocomplete="off" placeholder="IDまたはURL">
          <label for="status-filter">状態</label>
          <select id="status-filter">
            <option value="">すべて</option>
            <option value="ok">正常</option>
            <option value="failed">失敗</option>
            <option value="not_checked">未確認</option>
          </select>
          <label for="status-sort">並び順</label>
          <select id="status-sort">
            <option value="id">ID順</option>
            <option value="status">失敗を優先</option>
            <option value="last_attempted">最終試行が新しい順</option>
            <option value="last_updated">最終変更が新しい順</option>
          </select>
          <label for="status-refresh-interval">自動更新</label>
          <select id="status-refresh-interval">
            <option value="5000">5秒</option>
            <option value="15000" selected>15秒</option>
            <option value="30000">30秒</option>
            <option value="60000">60秒</option>
          </select>
          <button id="status-reset" type="button">条件をリセット</button>
          <button id="export-status" type="button" disabled>表示中をCSV保存</button>
        </div>
        <div id="status-table-wrap" class="table-wrap" role="region" aria-label="巡回対象の状態表。左右矢印キーで横スクロール" aria-keyshortcuts="ArrowLeft ArrowRight" tabindex="0">
          <table aria-labelledby="status-heading">
            <thead>
              <tr><th scope="col">対象</th><th scope="col">状態</th><th scope="col">最終試行</th><th scope="col">最終成功</th><th scope="col">最終変更</th><th scope="col">エラー</th><th scope="col">履歴</th></tr>
            </thead>
            <tbody id="status-rows"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="events-heading">
        <h2 id="events-heading">最近の通知</h2>
        <p class="muted">このページを開いている間に届いた通知を表示します。</p>
        <div>
          <label for="event-id">対象</label>
          <select id="event-id"><option value="">すべて</option></select>
          <label for="event-type">イベント</label>
          <select id="event-type">
            <option value="">すべて</option>
            <option value="changed">内容変更</option>
            <option value="poll_failed">巡回失敗</option>
            <option value="poll_recovered">巡回復旧</option>
          </select>
          <button id="apply-filter" type="button">通知を絞り込む</button>
          <button id="export-events" type="button" disabled>通知をCSV保存</button>
          <button id="clear-events" type="button" aria-controls="events">通知を消去</button>
        </div>
        <ul id="events" class="events" aria-live="polite" aria-relevant="additions" aria-atomic="false"></ul>
      </section>
    </main>

    <dialog id="history-dialog" aria-labelledby="history-title">
      <h2 id="history-title">変更履歴</h2>
      <p id="history-message" class="muted"></p>
      <div class="filters">
        <button id="history-newer" type="button" disabled>新しい履歴</button>
        <button id="history-older" type="button" disabled>古い履歴</button>
      </div>
      <button id="history-retry" type="button" hidden>再試行</button>
      <div id="history-entries"></div>
      <form method="dialog"><button type="submit">閉じる</button></form>
    </dialog>

    <script>
      const rows = document.querySelector("#status-rows");
      const statusTableWrap = document.querySelector("#status-table-wrap");
      const connection = document.querySelector("#connection");
      const updated = document.querySelector("#updated");
      const statusSummary = document.querySelector("#status-summary");
      const statusSearch = document.querySelector("#status-search");
      const statusFilter = document.querySelector("#status-filter");
      const statusSort = document.querySelector("#status-sort");
      const statusRefreshInterval = document.querySelector("#status-refresh-interval");
      const statusReset = document.querySelector("#status-reset");
      const exportStatusButton = document.querySelector("#export-status");
      const events = document.querySelector("#events");
      const exportEventsButton = document.querySelector("#export-events");
      const idFilter = document.querySelector("#event-id");
      const eventFilter = document.querySelector("#event-type");
      const historyDialog = document.querySelector("#history-dialog");
      const historyEntries = document.querySelector("#history-entries");
      const historyMessage = document.querySelector("#history-message");
      const historyNewer = document.querySelector("#history-newer");
      const historyOlder = document.querySelector("#history-older");
      const historyRetry = document.querySelector("#history-retry");
      const historyPageSize = 50;
      const API_REQUEST_TIMEOUT_MS = 10000;
      const STATUS_SEARCH_RENDER_DELAY_MS = 150;
      const STATUS_VIEW_STORAGE_KEY = "patrol.status-view.v1";
      const STATUS_FILTER_VALUES = new Set(["", "ok", "failed", "not_checked"]);
      const STATUS_SORT_VALUES = new Set(["id", "status", "last_attempted", "last_updated"]);
      const STATUS_REFRESH_INTERVAL_VALUES = new Set(["5000", "15000", "30000", "60000"]);
      const EVENT_PRESENTATION = new Map([
        ["changed", { label: "内容変更", className: "event-changed" }],
        ["poll_failed", { label: "巡回失敗", className: "event-failed" }],
        ["poll_recovered", { label: "巡回復旧", className: "event-recovered" }],
      ]);
      const RECONNECT_INITIAL_DELAY_MS = 1000;
      const RECONNECT_MAX_DELAY_MS = 30000;
      let currentHistoryId;
      let currentHistoryOffset = 0;
      let historyRequestId = 0;
      let historyRequestController;
      let historyOpener;
      let eventSocket;
      let reconnectTimer;
      let reconnectDelayMs = RECONNECT_INITIAL_DELAY_MS;
      let eventSocketConnected = false;
      let statusApiError;
      let statusRefreshInFlight = false;
      let statusRefreshPending = false;
      let lastStatusSnapshot;
      let currentStatusList = [];
      let recentEvents = [];
      let statusRefreshTimer;
      let statusSearchRenderTimer;

      async function fetchJson(url, controller = new AbortController()) {
        const timeout = setTimeout(() => controller.abort(), API_REQUEST_TIMEOUT_MS);
        try {
          const response = await fetch(url, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } catch (error) {
          if (controller.signal.aborted) {
            throw new Error("API応答が10秒以内にありませんでした");
          }
          throw error;
        } finally {
          clearTimeout(timeout);
        }
      }

      function cell(value, className) {
        const element = document.createElement("td");
        element.textContent = value;
        if (className) element.className = className;
        return element;
      }

      function createHistoryButton(id, label = "表示") {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.historyId = id;
        button.setAttribute("aria-label", `${id} の変更履歴を表示`);
        button.addEventListener("click", () => showHistory(id));
        return button;
      }

      function formatTime(unixMillis) {
        return unixMillis == null ? "—" : new Date(unixMillis).toLocaleString();
      }

      function httpTargetUrl(value) {
        try {
          const parsed = new URL(value);
          return parsed.protocol === "http:" || parsed.protocol === "https:"
            ? parsed.href
            : undefined;
        } catch {
          return undefined;
        }
      }

      function updateConnectionStatus() {
        let message;
        if (statusApiError) {
          message = `状態を取得できません: ${statusApiError}`;
        } else if (eventSocketConnected) {
          message = "状態APIとWebSocketに接続中";
        } else {
          message = "状態APIに接続中 (WebSocket再接続中)";
        }
        if (connection.textContent !== message) connection.textContent = message;
      }

      function renderDiff(before, after) {
        const beforeLines = before.split("\n");
        const afterLines = after.split("\n");
        const width = afterLines.length + 1;
        if (beforeLines.length * afterLines.length > 65536) return null;

        const lcs = new Uint16Array((beforeLines.length + 1) * width);
        for (let i = beforeLines.length - 1; i >= 0; i--) {
          for (let j = afterLines.length - 1; j >= 0; j--) {
            const index = i * width + j;
            lcs[index] = beforeLines[i] === afterLines[j]
              ? lcs[(i + 1) * width + j + 1] + 1
              : Math.max(lcs[(i + 1) * width + j], lcs[index + 1]);
          }
        }

        const diff = document.createElement("pre");
        diff.className = "history-diff";
        const addLine = (prefix, value, className) => {
          const line = document.createElement("span");
          line.className = `history-diff-line ${className}`;
          line.textContent = `${prefix}${value || " "}`;
          diff.append(line);
        };
        let i = 0;
        let j = 0;
        while (i < beforeLines.length || j < afterLines.length) {
          if (i < beforeLines.length && j < afterLines.length && beforeLines[i] === afterLines[j]) {
            addLine(" ", beforeLines[i], "");
            i++;
            j++;
          } else if (i < beforeLines.length && (j === afterLines.length || lcs[(i + 1) * width + j] >= lcs[i * width + j + 1])) {
            addLine("− ", beforeLines[i], "history-diff-remove");
            i++;
          } else {
            addLine("+ ", afterLines[j], "history-diff-add");
            j++;
          }
        }
        return diff;
      }

      function appendSnapshot(section, label, content) {
        const title = document.createElement("strong");
        title.textContent = label;
        const snapshot = document.createElement("pre");
        snapshot.className = "history-content";
        snapshot.textContent = content;
        section.append(title, snapshot);
      }

      async function showHistory(id, offset = 0) {
        const requestId = ++historyRequestId;
        historyRequestController?.abort();
        const controller = new AbortController();
        historyRequestController = controller;
        if (!historyDialog.open) {
          historyOpener = document.activeElement;
          historyDialog.showModal();
        }
        currentHistoryId = id;
        currentHistoryOffset = offset;
        historyEntries.replaceChildren();
        historyMessage.textContent = "履歴を読み込み中…";
        historyNewer.disabled = true;
        historyOlder.disabled = true;
        historyRetry.hidden = true;
        try {
          const query = new URLSearchParams({
            id,
            limit: String(historyPageSize),
            offset: String(offset),
          });
          const page = await fetchJson(`/api/v1/history?${query}`, controller);
          if (requestId !== historyRequestId) return;
          currentHistoryOffset = page.offset;
          historyMessage.textContent = page.total
            ? `${id} の変更履歴（${page.total}件中 ${page.offset + 1}〜${page.offset + page.entries.length}件）`
            : "変更履歴はありません。";
          historyNewer.disabled = !page.has_newer;
          historyOlder.disabled = !page.has_older;
          const entriesFragment = document.createDocumentFragment();
          for (const entry of page.entries) {
            const section = document.createElement("section");
            section.className = "history-entry";
            const heading = document.createElement("h3");
            heading.textContent = formatTime(entry.timestamp_unix_ms);
            section.append(heading);
            if (entry.previous_content !== null) {
              const diffTitle = document.createElement("strong");
              diffTitle.textContent = `差分${entry.previous_truncated || entry.content_truncated ? "（保存された先頭4 KiB同士の比較）" : ""}`;
              section.append(diffTitle);
              const diff = renderDiff(entry.previous_content, entry.content);
              if (diff) {
                section.append(diff);
              } else {
                const notice = document.createElement("p");
                notice.className = "muted";
                notice.textContent = "行数が多いため差分計算を省略しました。保存された本文を表示します。";
                section.append(notice);
                appendSnapshot(section, "変更前", entry.previous_content);
                appendSnapshot(section, "変更後", entry.content);
              }
            } else {
              const first = document.createElement("p");
              first.textContent = "変更前の内容は履歴にありません。";
              section.append(first);
              appendSnapshot(section, "保存された内容", entry.content);
            }
            entriesFragment.append(section);
          }
          historyEntries.replaceChildren(entriesFragment);
        } catch (error) {
          if (requestId !== historyRequestId) return;
          historyMessage.textContent = `履歴を取得できません: ${error.message}`;
          historyRetry.hidden = false;
        } finally {
          if (historyRequestController === controller) historyRequestController = undefined;
        }
      }

      historyDialog.addEventListener("close", () => {
        historyRequestId++;
        historyRequestController?.abort();
        historyRequestController = undefined;
        const focusTarget = historyOpener?.isConnected
          ? historyOpener
          : [...document.querySelectorAll("button[data-history-id]")]
            .find((button) => button.dataset.historyId === currentHistoryId);
        historyOpener = undefined;
        focusTarget?.focus();
      });

      historyRetry.addEventListener("click", () => {
        showHistory(currentHistoryId, currentHistoryOffset);
      });
      historyNewer.addEventListener("click", () => {
        showHistory(currentHistoryId, Math.max(0, currentHistoryOffset - historyPageSize));
      });
      historyOlder.addEventListener("click", () => {
        showHistory(currentHistoryId, currentHistoryOffset + historyPageSize);
      });

      function renderStatus(statusList, force = false) {
        const statusSnapshot = JSON.stringify(statusList);
        currentStatusList = statusList;
        updateStatusSummary(statusList);
        if (statusSnapshot === lastStatusSnapshot && !force) {
          const visibleCount = countVisibleStatuses(statusList);
          exportStatusButton.disabled = visibleCount === 0;
          updateStatusCount(statusList.length, visibleCount);
          updateConnectionStatus();
          return;
        }

        const selectedId = idFilter.value;
        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "すべて";
        const optionFragment = document.createDocumentFragment();
        optionFragment.append(allOption);
        for (const item of statusList) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.id;
          optionFragment.append(option);
        }
        idFilter.replaceChildren(optionFragment);
        const selectedIdExists = statusList.some((item) => item.id === selectedId);
        idFilter.value = selectedIdExists ? selectedId : "";
        if (selectedId && !selectedIdExists) restartEvents();

        const rowFragment = document.createDocumentFragment();
        const visibleStatuses = sortStatuses(filterStatuses(statusList));
        exportStatusButton.disabled = visibleStatuses.length === 0;
        if (statusList.length === 0) {
          const row = document.createElement("tr");
          const emptyCell = document.createElement("td");
          emptyCell.colSpan = 7;
          emptyCell.className = "muted";
          emptyCell.textContent = "巡回対象がありません。設定ファイルに対象を追加してください。";
          row.append(emptyCell);
          rowFragment.append(row);
        }
        if (statusList.length > 0 && visibleStatuses.length === 0) {
          const row = document.createElement("tr");
          const emptyCell = document.createElement("td");
          emptyCell.colSpan = 7;
          emptyCell.className = "muted";
          emptyCell.textContent = "条件に一致する対象はありません。";
          row.append(emptyCell);
          rowFragment.append(row);
        }
        for (const item of visibleStatuses) {
          const row = document.createElement("tr");
          const name = document.createElement("td");
          name.textContent = item.id;
          const url = document.createElement("div");
          url.className = "muted";
          const safeUrl = httpTargetUrl(item.url);
          if (safeUrl) {
            const link = document.createElement("a");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = item.url;
            link.setAttribute("aria-label", `${item.id} のURLを新しいタブで開く`);
            url.append(link);
          } else {
            url.textContent = item.url;
          }
          name.append(url);
          row.append(name);
          const label = statusLabel(item, true);
          row.append(cell(label, `status status-${normalizedStatus(item.status)}`));
          row.append(cell(formatTime(item.last_attempted_unix_ms)));
          row.append(cell(formatTime(item.last_success_unix_ms)));
          row.append(cell(formatTime(item.last_updated_unix_ms)));
          row.append(cell(item.last_error ?? ""));
          const historyCell = document.createElement("td");
          historyCell.append(createHistoryButton(item.id));
          row.append(historyCell);
          rowFragment.append(row);
        }

        const focusedHistoryId = rows.contains(document.activeElement)
          ? document.activeElement.dataset?.historyId
          : undefined;
        rows.replaceChildren(rowFragment);
        if (focusedHistoryId) {
          [...rows.querySelectorAll("button[data-history-id]")]
            .find((button) => button.dataset.historyId === focusedHistoryId)
            ?.focus();
        }
        updateStatusCount(statusList.length, visibleStatuses.length);
        updateConnectionStatus();
        lastStatusSnapshot = statusSnapshot;
      }

      function updateStatusSummary(statusList) {
        const counts = { ok: 0, failed: 0, not_checked: 0 };
        for (const item of statusList) {
          counts[normalizedStatus(item.status)] += 1;
        }
        statusSummary.textContent = `全体: 正常 ${counts.ok} ・ 失敗 ${counts.failed} ・ 未確認 ${counts.not_checked}`;
      }

      function filterStatuses(statusList) {
        const selectedStatus = statusFilter.value;
        const query = statusSearch.value.trim().toLocaleLowerCase();
        return statusList.filter((item) => {
          if (selectedStatus && normalizedStatus(item.status) !== selectedStatus) return false;
          if (!query) return true;
          return item.id.toLocaleLowerCase().includes(query)
            || item.url.toLocaleLowerCase().includes(query);
        });
      }

      function sortStatuses(statusList) {
        const sorted = [...statusList];
        switch (statusSort.value) {
          case "status":
            sorted.sort((a, b) => statusRank(a.status) - statusRank(b.status) || compareIds(a.id, b.id));
            break;
          case "last_attempted":
            sorted.sort((a, b) => compareTimestamps(b.last_attempted_unix_ms, a.last_attempted_unix_ms) || compareIds(a.id, b.id));
            break;
          case "last_updated":
            sorted.sort((a, b) => compareTimestamps(b.last_updated_unix_ms, a.last_updated_unix_ms) || compareIds(a.id, b.id));
            break;
          default:
            sorted.sort((a, b) => compareIds(a.id, b.id));
        }
        return sorted;
      }

      function statusRank(status) {
        const normalized = normalizedStatus(status);
        return normalized === "failed" ? 0 : normalized === "not_checked" ? 1 : 2;
      }

      function statusLabel(item, includeFailureCount = false) {
        const status = normalizedStatus(item.status);
        if (status === "ok") return "正常";
        if (status === "failed") {
          return includeFailureCount ? `失敗 (${item.consecutive_failures})` : "失敗";
        }
        return "未確認";
      }

      function normalizedStatus(status) {
        return status === "ok" || status === "failed" ? status : "not_checked";
      }

      function compareIds(a, b) {
        return a < b ? -1 : a > b ? 1 : 0;
      }

      function compareTimestamps(a, b) {
        if (a == null || b == null) return a == null ? (b == null ? 0 : -1) : 1;
        return a - b;
      }

      function countVisibleStatuses(statusList) {
        return filterStatuses(statusList).length;
      }

      function updateStatusCount(totalCount, visibleCount) {
        const countLabel = statusFilter.value || statusSearch.value.trim()
          ? `${visibleCount} / ${totalCount} 件を表示`
          : `${totalCount} 件`;
        updated.textContent = `更新: ${new Date().toLocaleTimeString()} ・ ${countLabel}`;
      }

      function exportVisibleStatuses() {
        const visibleStatuses = sortStatuses(filterStatuses(currentStatusList));
        if (visibleStatuses.length === 0) return;
        const records = [
          ["対象ID", "URL", "状態", "連続失敗数", "最終試行 (UTC)", "最終成功 (UTC)", "最終変更 (UTC)", "直近のエラー"],
          ...visibleStatuses.map((item) => [
            item.id,
            item.url,
            statusLabel(item),
            item.consecutive_failures ?? 0,
            formatExportTime(item.last_attempted_unix_ms),
            formatExportTime(item.last_success_unix_ms),
            formatExportTime(item.last_updated_unix_ms),
            item.last_error ?? "",
          ]),
        ];
        downloadCsv("status", records);
      }

      function exportRecentEvents() {
        if (recentEvents.length === 0) return;
        const records = [
          ["通知時刻", "イベント", "対象ID", "URL", "連続失敗数", "エラー"],
          ...recentEvents.map((event) => [
            event.timestamp ?? "",
            EVENT_PRESENTATION.get(event.event)?.label ?? event.event ?? "",
            event.id ?? "",
            event.url ?? "",
            event.consecutive_failures ?? "",
            event.error ?? "",
          ]),
        ];
        downloadCsv("notifications", records);
      }

      function downloadCsv(name, records) {
        const csv = "\uFEFF" + records.map((record) => record.map(csvField).join(",")).join("\r\n");
        const blobUrl = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = blobUrl;
        const timestamp = new Date().toISOString().replaceAll(":", "-").replaceAll(".", "-");
        link.download = `patrol-${name}-${timestamp}.csv`;
        document.body.append(link);
        link.click();
        setTimeout(() => {
          link.remove();
          URL.revokeObjectURL(blobUrl);
        }, 1000);
      }

      function csvField(value) {
        const text = String(value ?? "");
        const safeText = /^[\u0000-\u0020]*[=+@-]/.test(text) ? `'${text}` : text;
        return `"${safeText.replaceAll('"', '""')}"`;
      }

      function formatExportTime(unixMillis) {
        return Number.isFinite(unixMillis) ? new Date(unixMillis).toISOString() : "";
      }

      function restoreStatusView() {
        try {
          const saved = JSON.parse(localStorage.getItem(STATUS_VIEW_STORAGE_KEY) ?? "null");
          if (!saved || typeof saved !== "object" || Array.isArray(saved)) return;
          if (typeof saved.search === "string") statusSearch.value = saved.search;
          if (STATUS_FILTER_VALUES.has(saved.status)) statusFilter.value = saved.status;
          if (STATUS_SORT_VALUES.has(saved.sort)) statusSort.value = saved.sort;
          if (STATUS_REFRESH_INTERVAL_VALUES.has(String(saved.refreshIntervalMs))) {
            statusRefreshInterval.value = String(saved.refreshIntervalMs);
          }
        } catch {
          // Browser storage is optional; the controls still work without it.
        }
      }

      function saveStatusView() {
        try {
          localStorage.setItem(STATUS_VIEW_STORAGE_KEY, JSON.stringify({
            search: statusSearch.value,
            status: statusFilter.value,
            sort: statusSort.value,
            refreshIntervalMs: Number(statusRefreshInterval.value),
          }));
        } catch {
          // Browser storage is optional; the controls still work without it.
        }
      }

      function configureStatusRefresh() {
        clearInterval(statusRefreshTimer);
        statusRefreshTimer = setInterval(() => {
          if (!document.hidden) refreshStatus();
        }, Number(statusRefreshInterval.value));
      }

      function scheduleStatusSearchRender() {
        clearTimeout(statusSearchRenderTimer);
        statusSearchRenderTimer = setTimeout(() => {
          statusSearchRenderTimer = undefined;
          renderStatus(currentStatusList, true);
        }, STATUS_SEARCH_RENDER_DELAY_MS);
      }

      async function refreshStatus() {
        if (document.hidden) return;
        if (statusRefreshInFlight) {
          statusRefreshPending = true;
          return;
        }
        statusRefreshInFlight = true;
        try {
          const statusList = await fetchJson("/api/v1/status");
          statusApiError = undefined;
          renderStatus(statusList);
        } catch (error) {
          statusApiError = error.message;
          updateConnectionStatus();
        } finally {
          statusRefreshInFlight = false;
          if (statusRefreshPending) {
            statusRefreshPending = false;
            refreshStatus();
          }
        }
      }

      function connectEvents() {
        const scheme = location.protocol === "https:" ? "wss:" : "ws:";
        const endpoint = new URL("/", location.href);
        endpoint.protocol = scheme;
        if (idFilter.value) endpoint.searchParams.set("id", idFilter.value);
        if (eventFilter.value) endpoint.searchParams.set("event", eventFilter.value);
        const socket = new WebSocket(endpoint.toString());
        eventSocket = socket;
        socket.onopen = () => {
          if (eventSocket !== socket) return;
          eventSocketConnected = true;
          reconnectDelayMs = RECONNECT_INITIAL_DELAY_MS;
          updateConnectionStatus();
        };
        socket.onmessage = (message) => {
          if (eventSocket !== socket) return;
          let event;
          try { event = JSON.parse(message.data); } catch { return; }
          recentEvents.unshift(event);
          if (recentEvents.length > 20) recentEvents.pop();
          exportEventsButton.disabled = false;
          const item = document.createElement("li");
          const presentation = EVENT_PRESENTATION.get(event.event);
          item.className = presentation?.className ?? "";
          const eventLabel = presentation?.label ?? event.event;
          const details = document.createElement("span");
          details.className = "event-details";
          const eventTime = typeof event.timestamp === "string" ? event.timestamp : new Date().toLocaleTimeString();
          details.textContent = `${eventTime}  ${eventLabel}  ${event.id}  ${event.error ?? ""}`;
          item.append(details);
          if (typeof event.id === "string" && event.id) {
            item.append(createHistoryButton(event.id, "履歴"));
          }
          events.prepend(item);
          while (events.children.length > 20) events.lastElementChild.remove();
          refreshStatus();
        };
        socket.onclose = () => {
          if (eventSocket !== socket) return;
          eventSocketConnected = false;
          updateConnectionStatus();
          const delay = reconnectDelayMs;
          reconnectDelayMs = Math.min(reconnectDelayMs * 2, RECONNECT_MAX_DELAY_MS);
          reconnectTimer = setTimeout(connectEvents, delay);
        };
        socket.onerror = () => socket.close();
      }

      function restartEvents() {
        clearTimeout(reconnectTimer);
        reconnectDelayMs = RECONNECT_INITIAL_DELAY_MS;
        eventSocketConnected = false;
        updateConnectionStatus();
        events.replaceChildren();
        recentEvents = [];
        exportEventsButton.disabled = true;
        if (eventSocket) {
          eventSocket.onclose = null;
          eventSocket.close();
        }
        connectEvents();
      }

      restoreStatusView();
      document.querySelector("#refresh").addEventListener("click", refreshStatus);
      statusFilter.addEventListener("change", () => {
        saveStatusView();
        renderStatus(currentStatusList, true);
      });
      statusSort.addEventListener("change", () => {
        saveStatusView();
        renderStatus(currentStatusList, true);
      });
      statusRefreshInterval.addEventListener("change", () => {
        saveStatusView();
        configureStatusRefresh();
        refreshStatus();
      });
      statusSearch.addEventListener("input", () => {
        saveStatusView();
        scheduleStatusSearchRender();
      });
      statusReset.addEventListener("click", () => {
        clearTimeout(statusSearchRenderTimer);
        statusSearchRenderTimer = undefined;
        statusSearch.value = "";
        statusFilter.value = "";
        statusSort.value = "id";
        saveStatusView();
        renderStatus(currentStatusList, true);
      });
      exportStatusButton.addEventListener("click", exportVisibleStatuses);
      document.querySelector("#apply-filter").addEventListener("click", restartEvents);
      exportEventsButton.addEventListener("click", exportRecentEvents);
      document.querySelector("#clear-events").addEventListener("click", () => {
        events.replaceChildren();
        recentEvents = [];
        exportEventsButton.disabled = true;
      });
      statusTableWrap.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        if (statusTableWrap.scrollWidth <= statusTableWrap.clientWidth) return;
        event.preventDefault();
        statusTableWrap.scrollLeft += event.key === "ArrowRight" ? 120 : -120;
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshStatus();
      });
      if (!document.hidden) refreshStatus();
      configureStatusRefresh();
      connectEvents();
    </script>
  </body>
</html>
