[package]
name = "patrol"
version = "0.1.0"
edition = "2021"

[dependencies]
scraper = "0.27.0"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "fs",
    "sync",
    "io-std",
    "signal",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
] }
sha2 = "0.11.0"
toml = "1.1.6"
serde = "1.0.229"
serde_derive = "1.0.229"
futures-util = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
url = "2.5.8"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"
serde_json = "1.0.151"
ansi_term = "0.12.1"
uuid = { version = "1.27.0", features = ["v4"] }
once_cell = "1.21.4"
prettytable-rs = "0.10.0"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.34"
playwright = "0.0.20"
