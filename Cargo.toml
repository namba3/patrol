[package]
name = "patrol"
version = "0.1.0"
edition = "2021"

[dependencies]
scraper = "0.24"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "fs",
    "sync",
    "io-std",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
sha2 = "0.10"
toml = "0.9"
serde = "1"
serde_derive = "1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
async-trait = "0.1"
url = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.9"
fantoccini = { version = "0.22", default-features = false, features = [
    "rustls-tls",
] }
serde_json = "1"
ansi_term = "0.12"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
notify-rust = "4"
prettytable-rs = "0.10.0"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
playwright = "0.0.20"
