name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked

      - name: Build release binary
        run: cargo +stable build --locked --release
